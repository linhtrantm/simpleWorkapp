<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
  <title>Cài đặt</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body { overflow-y: auto; padding: 44px 48px; background: radial-gradient(ellipse at 20% 0%, rgba(245,138,31,.09), transparent 55%), var(--bg); }
    .page { max-width: 560px; margin: 0 auto; }
    header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; line-height: 1.6; }
    .close { border: 1px solid var(--border2); background: rgba(255,255,255,.04); color: var(--muted); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 15px; }
    .close:hover { color: var(--text); background: rgba(255,255,255,.09); }
    h2 { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    .list { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--border2); }
    .row:first-child { border-top: 0; }
    .ico { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; transition: opacity .2s, filter .2s; }
    .ico img { width: 22px; height: 22px; filter: brightness(0) invert(1); }
    .row.off .ico { opacity: .35; filter: grayscale(1); }
    .name { flex: 1; font-size: 14px; font-weight: 600; }
    .state { font-size: 11.5px; color: var(--muted); margin-right: 4px; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; cursor: pointer; }
    .switch input { display: none; }
    .switch span { position: absolute; inset: 0; border-radius: 12px; background: rgba(255,255,255,.12); transition: background .2s; }
    .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .switch input:checked + span { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:disabled + span { opacity: .45; cursor: not-allowed; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 16px; }
    .seg { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: 600 12.5px 'Sora', sans-serif; padding: 8px 18px; border-radius: 9px; cursor: pointer; }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1a1004; }
    .section { margin-top: 32px; }
    footer { margin-top: 36px; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 10px; }
    footer .wordmark { font-size: 13px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Cài đặt</h1>
        <p class="sub">Chọn app muốn hiển thị trên thanh bên.</p>
      </div>
      <button class="close" id="close" title="Đóng">✕</button>
    </header>
    <h2>Ứng dụng</h2>
    <div class="list" id="list"></div>
    <p class="note">App bị tắt sẽ không được tải và không nhận tin nhắn. Bật lại thì app tải lại, phiên đăng nhập vẫn còn. Luôn phải giữ ít nhất một app.</p>
    <div class="section">
      <h2>Kích thước icon</h2>
      <div class="seg" id="sizes">
        <button data-size="small">Nhỏ</button>
        <button data-size="medium">Vừa</button>
        <button data-size="large">Lớn</button>
      </div>
      <p class="note">Nhỏ chỉ hiện icon, Vừa và Lớn hiện thêm tên app.</p>
    </div>
    <footer><span class="wordmark"><span>simple</span><span class="soft">Work</span></span><span id="ver"></span></footer>
  </div>
  <script src="settings-page.js"></script>
</body>
</html>
