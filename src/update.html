<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Cập nhật</title>
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/looks.css">
  <link rel="stylesheet" href="assets/patterns.css">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/noel.css">
  <style>
    html, body { background: var(--bg); }
    body { display: flex; flex-direction: column; padding: 46px 28px 22px; -webkit-app-region: drag; }
    .head { display: flex; align-items: center; gap: 14px; }
    .head img { width: 56px; height: 56px; flex: none; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .ver { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
    h2 { margin: 20px 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .notes { flex: 1; min-height: 0; overflow-y: auto; -webkit-app-region: no-drag; user-select: text; -webkit-user-select: text; background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 12px 16px; }
    .notes ul { list-style: none; display: grid; gap: 7px; }
    .notes li { position: relative; padding-left: 16px; font-size: 13px; line-height: 1.5; }
    .notes li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .notes .none { color: var(--muted); font-size: 13px; }
    .bar { margin-top: 16px; height: 6px; border-radius: 3px; background: var(--border2); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
    .status { margin-top: 8px; min-height: 18px; font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; -webkit-app-region: no-drag; }
    button { border: 0; border-radius: 10px; padding: 9px 18px; font: 700 12.5px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; background: var(--accent); color: var(--on-accent); }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
    button:disabled { opacity: .45; cursor: default; }
  </style>
</head>
<body>
  <div class="head">
    <img src="assets/app-icon.png" alt="simpleWork">
    <div>
      <h1 data-i18n="updPopupTitle">Có bản cập nhật mới</h1>
      <div class="ver" id="ver"></div>
    </div>
  </div>
  <h2 data-i18n="updWhatsNew">Có gì mới</h2>
  <div class="notes" id="notes"></div>
  <div class="bar" id="bar" hidden><i id="fill"></i></div>
  <div class="status" id="status"></div>
  <div class="actions">
    <button class="ghost" id="later" data-i18n="updLater">Để sau</button>
    <button id="go"></button>
  </div>
  <script src="i18n.js"></script>
  <script src="fx.js"></script>
  <script src="theme.js"></script>
  <script src="update.js"></script>
</body>
</html>
