<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
  <title>Việc đang làm</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html, body { background: transparent; overflow: hidden; height: auto; }
    body { padding: 0; user-select: none; -webkit-user-select: none; }
    #card { margin: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--border2); padding: 12px 14px 12px; -webkit-app-region: drag; position: relative; }
    #card button { -webkit-app-region: no-drag; }
    .label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .live .label { color: var(--accent); }
    .name { font-size: 15px; font-weight: 700; margin: 3px 0 10px; line-height: 1.3; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; -webkit-app-region: no-drag; }
    .actions { display: flex; gap: 6px; }
    .actions button { border: 0; border-radius: 8px; padding: 6px 12px; font: 700 12px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; background: var(--accent); color: var(--on-accent); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
    .x { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; opacity: .5; }
    .x:hover { opacity: 1; }
    .next { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
    .next span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .next button { border: 1px solid var(--border2); background: transparent; color: var(--text); border-radius: 7px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
    .next button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div id="card"></div>
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <script src="daytask-widget.js"></script>
</body>
</html>
