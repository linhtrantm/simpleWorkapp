<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
  <title>simpleWork</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body { background: var(--band); }
    #topbar { position: absolute; top: 0; left: 0; right: 0; height: 30px; -webkit-app-region: drag; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--muted); border-bottom: 1px solid var(--border2); background: var(--bg); }
    #topbar .wordmark { position: absolute; left: 84px; font-size: 11.5px; color: var(--text); }
    #ext { -webkit-app-region: no-drag; position: absolute; right: 12px; top: 4px; height: 22px; padding: 0 10px; display: none; align-items: center; gap: 5px; border: 1px solid var(--border2); border-radius: 7px; background: rgba(255,255,255,.05); color: var(--muted); font: 600 11px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; }
    #ext:hover { color: var(--text); background: rgba(255,255,255,.1); }
    #side { position: absolute; top: 30px; bottom: 0; left: 0; width: var(--side-w, 76px); border-right: 1px solid var(--border2); display: flex; flex-direction: column; padding: 12px 0 14px; -webkit-app-region: drag; }
    #bar { flex: 1; margin-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; overflow-y: auto; overflow-x: hidden; }
    #bar::-webkit-scrollbar { display: none; }
    .item, .gear { -webkit-app-region: no-drag; position: relative; width: calc(var(--side-w, 72px) - 16px); padding: 8px 0 7px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: background .15s; }
    .item:hover, .gear:hover { background: rgba(255, 255, 255, 0.04); }
    .item.active { background: linear-gradient(180deg, rgba(245,138,31,.16), rgba(255,180,84,.07)); box-shadow: inset 0 0 0 1px var(--border); }
    .item.active::before { content: ''; position: absolute; left: -8px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px var(--accent); }
    .icon { position: relative; width: var(--icon, 38px); height: var(--icon, 38px); border-radius: 12px; display: flex; align-items: center; justify-content: center; opacity: .6; filter: saturate(.8); transition: opacity .15s, transform .15s, box-shadow .15s, filter .15s; }
    .item:hover .icon { opacity: .9; }
    .item.active .icon { opacity: 1; filter: none; transform: translateY(-1px); box-shadow: 0 6px 18px -4px var(--glow, #000); }
    .icon .letter { color: #fff; font-weight: 700; font-size: calc(var(--glyph, 21px) * 0.95); line-height: 1; pointer-events: none; }
    .icon img { width: var(--glyph, 21px); height: var(--glyph, 21px); filter: brightness(0) invert(1); pointer-events: none; }
    .label { display: var(--label-display, block); font-size: 9.5px; font-weight: 600; color: var(--muted); max-width: calc(var(--side-w, 72px) - 6px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .15s; }
    .item.active .label { color: var(--text); }
    .badge { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 5px; line-height: 14px; text-align: center; background: #ef4444; color: #fff; border-radius: 9px; font-size: 10px; font-weight: 700; border: 2px solid var(--band); }
    .reload { position: absolute; bottom: -6px; right: -7px; width: 18px; height: 18px; line-height: 13px; padding: 0; display: none; border: 2px solid var(--band); border-radius: 50%; background: #e2e8f0; color: #0f172a; font-size: 11px; cursor: pointer; -webkit-app-region: no-drag; }
    .item:hover .reload { display: block; }
    .gear { margin: 0 auto; color: var(--muted); }
    .gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .gear.active { color: var(--text); background: linear-gradient(180deg, rgba(245,138,31,.16), rgba(255,180,84,.07)); box-shadow: inset 0 0 0 1px var(--border); }
    .gear:hover { color: var(--text); }
  </style>
</head>
<body>
  <div id="topbar"><span class="wordmark"><span>simple</span><span class="soft">Work</span></span><span id="title">simpleWork</span><button id="ext" data-i18n="openBrowser" data-i18n-title="openBrowserTitle">↗ Mở trong trình duyệt</button></div>
  <div id="side">
    <div id="bar"></div>
    <div class="gear" id="gear" data-i18n-title="settings" title="Cài đặt">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
