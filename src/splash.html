<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
  <title>simpleWork</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; -webkit-app-region: drag; transition: opacity .35s ease; background: var(--bg); }
    body.hide { opacity: 0; }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; animation: fade .5s ease both; }
    .wordmark { font-size: 46px; font-weight: 300; letter-spacing: -0.02em; }
    .wordmark .soft { font-weight: 600; }
    .tag { font-family: var(--mono); font-size: 13px; color: var(--brand); letter-spacing: .02em; }
    .track { position: relative; width: 160px; height: 2px; background: var(--border2); overflow: hidden; margin-top: 12px; }
    .track i { position: absolute; top: 0; bottom: 0; width: 40%; background: var(--brand); animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { 0% { left: -45%; } 100% { left: 105%; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark"><span>simple</span><span class="soft">Work</span></div>
    <div class="tag">// Unified Business Management</div>
    <div class="track"><i></i></div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
