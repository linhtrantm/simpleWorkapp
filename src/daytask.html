<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Việc cần làm</title>
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/looks.css">
  <link rel="stylesheet" href="assets/patterns.css">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/noel.css">
  <style>
    :root { --hit: 40px; --row: 48px; --gap: 6px; --s1: color-mix(in srgb, var(--text) 6%, var(--card)); --s2: color-mix(in srgb, var(--text) 12%, var(--card)); } /* tông nền phụ đặc (không trong suốt) để hoạ tiết nền không lộ qua nút */
    html, body { background: var(--card); height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .col { width: min(620px, calc(100% - 56px)); margin: 0 auto; }
    header { flex: none; padding-top: 40px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; }
    .prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); padding-bottom: 4px; white-space: nowrap; }
    .pbar { width: 72px; height: 8px; border-radius: 4px; background: var(--s2); overflow: hidden; }
    .pbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--accent); transition: width .35s; }
    .tabs { display: flex; gap: 4px; margin: 16px 0 6px; padding: 4px; border-radius: 14px; background: var(--s1); }
    .tabs button { flex: 1; min-height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; }
    .tabs button:hover { color: var(--text); }
    .tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    main { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 24px; }
    [hidden] { display: none !important; }
    footer { flex: none; padding: 8px 0 18px; }
    .adder { position: relative; }
    .adder::before { content: '+'; position: absolute; left: 18px; top: 50%; transform: translateY(-52%); font-size: 22px; font-weight: 600; color: var(--accent); pointer-events: none; }
    .add { width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; background: var(--input); border: 1px solid var(--border2); border-radius: 16px; color: var(--text); padding: 0 16px; height: 50px; font: 15px -apple-system, BlinkMacSystemFont, sans-serif; outline: none; }
    .adder .add { padding-left: 44px; }
    .add:focus { border-color: var(--accent); }
    h2 { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px 4px; }
    .grp { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--hit); margin-top: 14px; padding: 0 6px; border: 0; background: transparent; color: var(--muted); font: 700 12px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-align: left; }
    .grp:hover { color: var(--text); }
    .grp i { font-style: normal; display: inline-block; transition: transform .2s; }
    .grp.open i { transform: rotate(90deg); }
    #nav { display: flex; align-items: center; gap: var(--gap); margin: 6px 0 12px; position: relative; }
    .navbtn svg { width: 18px; height: 18px; display: block; margin: auto; }
    .navbtn { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--s1); color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; flex: none; }
    .navbtn:disabled { opacity: .3; cursor: default; }
    .navbtn:not(:disabled):hover { background: var(--s2); }
    .navchip { min-height: 36px; border: 0; background: var(--s1); color: var(--muted); border-radius: 18px; padding: 0 14px; font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; white-space: nowrap; flex: none; }
    .navchip:hover { color: var(--text); background: var(--s2); }
    .navchip.on { background: var(--accent); color: var(--on-accent); }
    .navdate { position: absolute; right: 0; top: 0; width: 1px; height: 36px; opacity: 0; pointer-events: none; }
    #cal { margin-left: auto; }
    .upcoming { display: flex; align-items: center; gap: var(--gap); overflow-x: auto; margin: -2px 0 12px; scrollbar-width: none; }
    .upcoming::-webkit-scrollbar { display: none; }
    .uplabel { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 2px; flex: none; }
    .carry { margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: var(--input); border: 1px solid var(--accent); }
    .carry b { font-size: 14px; }
    .carry p { margin: 4px 0 12px; font-size: 12.5px; color: var(--muted); }
    .carry button { min-height: 36px; border: 0; border-radius: 10px; padding: 0 16px; font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; margin-right: 8px; background: var(--accent); color: var(--on-accent); }
    .carry button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
    #todo { margin-top: 6px; }
    .row { display: flex; align-items: center; gap: 12px; min-height: var(--row); padding: 6px 8px; margin-bottom: 2px; border-radius: 14px; }
    .row:hover { background: var(--s1); }
    .row.dragging { opacity: .4; }
    .grip { color: var(--muted); cursor: grab; opacity: .35; user-select: none; width: 14px; text-align: center; flex: none; }
    .row:hover .grip { opacity: 1; }
    .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; flex: none; padding: 0; position: relative; }
    .tick:hover { border-color: var(--accent); }
    .done .tick { background: var(--accent); border-color: var(--accent); }
    .done .tick::after { content: '✓'; position: absolute; inset: 0; color: var(--on-accent); font-size: 14px; line-height: 20px; text-align: center; font-weight: 800; }
    .title { flex: 1; font-size: 15px; line-height: 1.35; outline: none; user-select: text; -webkit-user-select: text; word-break: break-word; }
    .done .title { color: var(--muted); text-decoration: line-through; }
    .tag { font-size: 11.5px; color: var(--muted); background: var(--s1); border-radius: 8px; padding: 3px 8px; flex: none; white-space: nowrap; }
    .tag.live { color: var(--on-accent); background: var(--accent); font-weight: 700; }
    .del { width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; border-radius: 10px; flex: none; opacity: .45; }
    .row:hover .del, .tpl:hover .del { opacity: 1; }
    .del:hover { color: #f87171; background: var(--s1); }
    .row.doing .title { font-weight: 700; }
    .play { min-height: 34px; border: 0; background: var(--s2); color: var(--accent); border-radius: 10px; padding: 0 14px; font: 700 12.5px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; flex: none; white-space: nowrap; }
    .play:hover { background: var(--accent); color: var(--on-accent); }
    .now { position: relative; margin-top: 4px; padding: 16px 18px; border-radius: 18px; background: var(--accent); color: var(--on-accent); }
    .now small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
    .now b { display: block; font-size: 18px; margin: 4px 70px 14px 0; word-break: break-word; }
    .now .clk { position: absolute; right: 18px; top: 14px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; opacity: .95; }
    .now button { min-height: var(--hit); border: 0; border-radius: 12px; padding: 0 18px; font: 700 13px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; margin-right: 8px; background: var(--card); color: var(--text); }
    .now button.ghost { background: transparent; color: var(--on-accent); border: 1px solid currentColor; opacity: .9; }
    .switch { margin: 4px 0 8px 40px; padding: 12px 14px; border-radius: 14px; background: var(--input); border: 1px solid var(--accent); font-size: 13px; }
    .switch p { margin: 0 0 10px; }
    .switch button { min-height: 36px; border: 0; border-radius: 10px; padding: 0 14px; font: 600 12.5px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; margin: 0 6px 6px 0; background: var(--accent); color: var(--on-accent); }
    .switch button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
    .tpl { display: flex; align-items: center; gap: 12px; min-height: var(--row); padding: 8px 12px; margin-bottom: var(--gap); border-radius: 14px; background: var(--s1); font-size: 14.5px; }
    .tpl .t { flex: 1; word-break: break-word; }
    .days { display: flex; gap: 4px; }
    .days span, .days button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--s2); font: 600 11px -apple-system, BlinkMacSystemFont, sans-serif; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); cursor: default; padding: 0; }
    .days .on { background: var(--accent); color: var(--on-accent); }
    .days button { cursor: pointer; }
    .addtpl { display: grid; gap: 10px; padding: 14px; margin-bottom: 14px; border-radius: 18px; background: var(--s1); }
    .addtpl .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .addtpl .go { min-height: var(--hit); border: 0; border-radius: 12px; padding: 0 20px; font: 700 13px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; background: var(--accent); color: var(--on-accent); }
    .pref { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 8px; border-radius: 14px; font-size: 14.5px; cursor: pointer; }
    .pref:hover { background: var(--s1); }
    .pref .t { flex: 1; }
    .pref input[type=time], .pref input[type=number] { background: var(--input); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); padding: 0 10px; height: 36px; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; width: 96px; }
    .tog { position: relative; width: 44px; height: 26px; flex: none; }
    .tog input { display: none; }
    .tog span { position: absolute; inset: 0; border-radius: 13px; background: var(--s2); transition: background .25s; }
    .tog span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
    .tog input:checked + span { background: var(--accent); }
    .tog input:checked + span::after { transform: translateX(18px); }
    .fly { position: fixed; z-index: 50; padding: 9px 16px; border-radius: 18px 18px 4px 18px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
    .empty { color: var(--muted); font-size: 14px; padding: 28px 8px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="col">
      <div class="head">
        <h1 id="title">Việc cần làm</h1>
        <div class="prog" id="prog"><span id="progText"></span><div class="pbar"><i id="progBar"></i></div></div>
      </div>
      <div class="tabs" id="tabs">
        <button data-tab="today" data-i18n="dayTabToday">Hôm nay</button>
        <button data-tab="repeat" data-i18n="dayTabRepeat">Lặp lại</button>
        <button data-tab="prefs" data-i18n="dayTabRemind">Nhắc nhở</button>
      </div>
    </div>
  </header>
  <main>
    <div class="col">
      <section id="pageToday">
        <div id="nav"></div>
        <div id="upc"></div>
        <div id="now"></div>
        <div id="carry"></div>
        <div id="todo"></div>
        <div id="doneWrap"><button class="grp" id="doneToggle"><i>▸</i><span id="doneLabel"></span></button><div id="done"></div></div>
      </section>
      <section id="pageRepeat" hidden>
        <div class="addtpl form">
          <input class="add" id="tplTitle" type="text" maxlength="200" data-i18n-placeholder="dayTplPlaceholder" placeholder="Việc lặp lại, ví dụ: Họp đầu tuần">
          <div class="bar"><div class="days" id="tplDays"></div><button class="go" id="tplAdd" data-i18n="dayTplAdd">Thêm</button></div>
        </div>
        <div id="tpls"></div>
      </section>
      <section id="pagePrefs" hidden>
        <div id="prefs"></div>
      </section>
    </div>
  </main>
  <footer id="dock">
    <div class="col"><div class="adder"><input class="add" id="add" type="text" maxlength="200" data-i18n-placeholder="dayAddPlaceholder" placeholder="Nhấn Enter để lưu"></div></div>
  </footer>
  <script src="i18n.js"></script>
  <script src="fx.js"></script>
  <script src="theme.js"></script>
  <script src="daytask-page.js"></script>
</body>
</html>
