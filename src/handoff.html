<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
  <title>simpleWork</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html, body { background: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    .card { width: 380px; padding: 28px 28px 24px; border-radius: 22px; text-align: center; background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--border); box-shadow: 0 30px 80px -20px var(--shadow); animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    .ico { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 28%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -10px 18px rgba(0,0,0,.16), 0 14px 30px -10px var(--glow, #000); }
    .ico img { width: 34px; height: 34px; filter: brightness(0) invert(1); }
    .ico .letter { color: #fff; font-size: 28px; font-weight: 700; }
    h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    p { margin-top: 10px; font-size: 12.5px; line-height: 1.65; color: var(--muted); }
    button { margin-top: 20px; border: 0; border-radius: 12px; padding: 11px 24px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); font: 700 13px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; box-shadow: 0 10px 24px -10px var(--accent); transition: filter .15s, transform .15s; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="ico" id="ico"></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <button id="btn"></button>
  </div>
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <script src="handoff.js"></script>
</body>
</html>
