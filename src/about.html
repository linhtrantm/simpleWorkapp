<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
  <title>About</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html, body { background: var(--bg); }
    body { display: flex; flex-direction: column; align-items: center; padding: 44px 24px 0; -webkit-app-region: drag; text-align: center; }
    .icon { width: 116px; height: 116px; margin-top: 4px; filter: drop-shadow(0 14px 20px var(--shadow)); animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
    h1 { margin-top: 14px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    h1 .soft { color: var(--brand); }
    .ver { margin-top: 12px; font-size: 12.5px; color: var(--text); }
    .by { margin-top: 18px; font-size: 12.5px; color: var(--text); }
    .team { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .team a { color: inherit; text-decoration: none; -webkit-app-region: no-drag; }
    .team a:hover { color: var(--text); text-decoration: underline; }
    footer { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border2); font-size: 12px; color: var(--text); }
    footer a { -webkit-app-region: no-drag; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background .15s, color .15s; }
    footer a:hover { background: var(--hover); color: var(--text); }
    footer svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <img class="icon" src="assets/app-icon.png" alt="simpleWork">
  <h1><span>simple</span><span class="soft">Work</span></h1>
  <div class="ver" id="ver"></div>
  <div class="by" data-i18n="aboutDeveloped">Phát triển và duy trì bởi</div>
  <div class="team"><a href="https://simplesoft.com.vn" target="_blank">SimpleSoft</a></div>
  <footer>
    <span id="copy"></span>
    <a href="https://simplesoft.com.vn" target="_blank" data-i18n-title="aboutWebsite" title="Mở trang web">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9z"/></svg>
    </a>
  </footer>
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <script src="about.js"></script>
</body>
</html>
